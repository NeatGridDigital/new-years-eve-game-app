:root{--bg:#0C1230;--bg2:#1A2156;--card:#18204A;--soft:#252E60;--line:#343E74;--ink:#F7F3EA;--mut:#AEB4D6;
--red:#E0457B;--red2:#C2306A;--green:#21A398;--gold:#E7B94C;--goldsoft:#3A3322;--ok:#3CC487;--bad:#E05D5D;color-scheme:dark}
:root[data-mode=light]{--bg:#FAF6EE;--bg2:#F1E8D8;--card:#FFFFFF;--soft:#F2EADB;--line:#E4D7C2;--ink:#1D2240;--mut:#6C6A80;
--red:#C2306A;--red2:#A3255A;--green:#18877D;--gold:#B8862A;--goldsoft:#FBF0D6;--ok:#1F9A62;--bad:#C23B3B;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;outline:none;font-size:22px}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 50% 0%,var(--bg2),var(--bg))}
#stage{width:1600px;height:900px;position:relative;transform-origin:center center;flex:none}
h1,h2,h3{font-family:"DM Serif",Georgia,serif;font-weight:400;margin:0}
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-12px;border-radius:50%;background:#F4D27A;opacity:.45;animation:fall linear infinite}
:root[data-mode=light] .snow i{background:#D9B467}
@keyframes fall{to{transform:translateY(930px) translateX(30px)}}
.top{position:absolute;left:48px;right:48px;top:30px;display:flex;align-items:center;gap:16px;z-index:3}
